version = 3
format = "markdown"

[library]
path = "specspine"
default_template = "specification"
frontmatter_document_title = "title"

[markdown]
refs_extension = ".md"
refs_path = "relative"
refs_text = "preserve"

[markdown.formatting]
preserve_newlines = true
preserve_line_breaks = true

[completion]
link_format = "markdown"

[templates.specification]
key_template = "{{slug}}"
document_template = "---\nspecspine: 5\ntitle: {{title}}\nkind: component\nsummary: Describe the durable boundary contract.\nfacets:\n  architecture: missing\n  behavior: missing\n  interfaces: missing\n  data: missing\n  failure: missing\n  quality: missing\n  verification: missing\nblockers: []\nimplementation_freedom: contract-equivalent\n---\n\n# {{title}}\n\n## Responsibility\n\n{{body}}\n"

[schemas.specification]
match = "**"
