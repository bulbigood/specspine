$schema: https://document-schema.org/draft/2026-06/schema
description: Specspine v5 specification document
frontmatter:
  type: object
  additionalProperties: false
  required: [specspine, title, kind, summary, facets, coverage, blockers, implementation_freedom]
  properties:
    specspine: { const: 5 }
    title: { type: string, minLength: 1 }
    kind: { enum: [system, subsystem, component, capability, behavior, interface, data, policy, deployment, concept] }
    summary: { type: string, minLength: 1 }
    aliases:
      type: array
      uniqueItems: true
      items: { type: string, minLength: 1 }
    facets:
      type: object
      additionalProperties: false
      required: [architecture, behavior, interfaces, data, failure, quality, verification]
      properties:
        architecture: { enum: [complete, partial, missing, not-applicable] }
        behavior: { enum: [complete, partial, missing, not-applicable] }
        interfaces: { enum: [complete, partial, missing, not-applicable] }
        data: { enum: [complete, partial, missing, not-applicable] }
        failure: { enum: [complete, partial, missing, not-applicable] }
        quality: { enum: [complete, partial, missing, not-applicable] }
        verification: { enum: [complete, partial, missing, not-applicable] }
    coverage:
      type: object
      additionalProperties: false
      required: [external-boundary]
      properties:
        external-boundary: { enum: [open, exhaustive] }
    blockers:
      type: array
      uniqueItems: true
      items: { type: string, pattern: '^OQ-[a-z0-9]+(?:-[a-z0-9]+)*$' }
    implementation_freedom: { enum: [contract-equivalent, architecture-constrained] }
    inspection:
      type: object
      additionalProperties: false
      required: [source, inspected, mode]
      properties:
        source: { type: string, minLength: 1 }
        inspected: { type: string, format: date }
        mode: { enum: [survey, deepen, refresh, drift] }
    assets:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [path, role, format, normative]
        properties:
          path: { type: string, minLength: 1 }
          role: { enum: [interface-contract, data-schema, scenario, fixture, verification] }
          format: { type: string, minLength: 1 }
          normative: { type: boolean }
sections:
  - header: { minLength: 1 }
    maxContains: 1
    sections:
      - header: { const: Responsibility }
        maxContains: 1
      - header: { const: Boundaries }
        minContains: 0
        maxContains: 1
      - header: { const: Behavior }
        minContains: 0
        maxContains: 1
      - header: { enum: [Interfaces, Information model, Data ownership, Lifecycle and invariants, Failure behavior, Edge cases, Configuration contract, Compatibility] }
        minContains: 0
        maxContains: 8
      - header: { const: Requirements }
        minContains: 0
        maxContains: 1
        blocks: [{ type: bullet-list, items: { text: { pattern: '^REQ-[a-z0-9]+(?:-[a-z0-9]+)* — .+' } } }]
        additionalBlocks: false
      - header: { const: Guarantees }
        minContains: 0
        maxContains: 1
        blocks: [{ type: bullet-list, items: { text: { pattern: '^GUA-[a-z0-9]+(?:-[a-z0-9]+)* — .+' } } }]
        additionalBlocks: false
      - header: { const: Invariants }
        minContains: 0
        maxContains: 1
        blocks: [{ type: bullet-list, items: { text: { pattern: '^INV-[a-z0-9]+(?:-[a-z0-9]+)* — .+' } } }]
        additionalBlocks: false
      - header: { const: Quality constraints }
        minContains: 0
        maxContains: 1
        blocks: [{ type: bullet-list, items: { text: { pattern: '^QLT-[a-z0-9]+(?:-[a-z0-9]+)* — .+' } } }]
        additionalBlocks: false
      - header: { const: Verification }
        minContains: 0
        maxContains: 1
        blocks: [{ type: bullet-list, items: { text: { pattern: '^VER-[a-z0-9]+(?:-[a-z0-9]+)* — .+' } } }]
        additionalBlocks: false
      - header: { const: Decisions }
        minContains: 0
        maxContains: 1
        blocks: [{ type: bullet-list, items: { text: { pattern: '^DEC-[a-z0-9]+(?:-[a-z0-9]+)* — .+' } } }]
        additionalBlocks: false
      - header: { const: Constraints }
        minContains: 0
        maxContains: 1
        blocks: [{ type: bullet-list, items: { text: { pattern: '^CON-[a-z0-9]+(?:-[a-z0-9]+)* — .+' } } }]
        additionalBlocks: false
      - header: { const: Observed }
        minContains: 0
        maxContains: 1
        blocks: [{ type: bullet-list, items: { text: { pattern: '^OBS-[a-z0-9]+(?:-[a-z0-9]+)* — .+' } } }]
        additionalBlocks: false
      - header: { const: Inferred }
        minContains: 0
        maxContains: 1
        blocks: [{ type: bullet-list, items: { text: { pattern: '^INF-[a-z0-9]+(?:-[a-z0-9]+)* — .+' } } }]
        additionalBlocks: false
      - header: { const: Open questions }
        minContains: 0
        maxContains: 1
        blocks: [{ type: bullet-list, items: { text: { pattern: '^OQ-[a-z0-9]+(?:-[a-z0-9]+)* — .+' } } }]
        additionalBlocks: false
      - header: { enum: [Known divergences, Implementation, Risks, Rationale and trade-offs, Terminology] }
        minContains: 0
        maxContains: 5
    additionalSections: false
additionalSections: false
